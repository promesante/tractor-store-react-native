packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

# React Native's Gradle build and Re.Pack resolve packages from a flat node_modules.
nodeLinker: hoisted

# Peers are declared explicitly, so pnpm doesn't pull in web-only peers such as
# react-native-web, or a second TypeScript.
autoInstallPeers: false
peerDependencyRules:
  # Web-only peers of Gluestack and React Aria, never used on native.
  ignoreMissing:
    - react-native-web
    - "@react-spectrum/provider"

# One version per dependency across the workspace, pinned exactly. Libraries shared as
# Module Federation singletons must match between host and remotes, or the app crashes
# at runtime. React Native, Rspack and Module Federation follow the versions Re.Pack's
# own test apps use: https://github.com/callstack/repack/blob/main/pnpm-workspace.yaml
catalog:
  # Tooling
  "@eslint/js": 10.0.1
  eslint: 10.13.0
  eslint-plugin-react-hooks: 7.1.1
  prettier: 3.9.10
  turbo: 2.11.10
  typescript: 5.9.3
  typescript-eslint: 8.72.0
  vitest: 5.0.5
  # React Native
  "@babel/core": 7.29.7
  "@babel/plugin-transform-react-jsx": 7.29.7
  "@react-native-community/cli": 20.2.0
  "@react-native-community/cli-platform-android": 20.2.0
  "@react-native-community/cli-platform-ios": 20.2.0
  "@react-native/babel-preset": 0.88.0
  "@react-native/metro-config": 0.88.0
  "@react-native/typescript-config": 0.88.0
  "@types/react": 19.3.0
  react: 19.3.0
  # Imported by react-aria, a Gluestack dependency, even on native.
  react-dom: 19.3.0
  react-native: 0.88.0
  # Re.Pack and Module Federation. Rspack stays on 1.6.0: 1.6.2+ breaks MF v2 polyfill ordering.
  "@callstack/repack": 5.4.2
  "@callstack/repack-plugin-nativewind": 5.4.2
  "@callstack/repack-plugin-reanimated": 5.4.2
  "@module-federation/enhanced": 2.9.2
  "@module-federation/runtime": 2.9.2
  "@rspack/core": 1.6.0
  "@swc/helpers": 0.5.23
  # Native libraries, compiled into the host
  "@react-navigation/native": 7.3.14
  "@react-navigation/native-stack": 7.18.6
  react-native-reanimated: 4.7.1
  react-native-safe-area-context: 5.10.1
  react-native-screens: 4.30.0
  react-native-svg: 15.16.0
  react-native-worklets: 0.13.0
  # Gluestack UI v3 on NativeWind 4, the stable line Re.Pack's NativeWind plugin supports
  "@gluestack-ui/core": 3.0.25
  "@gluestack-ui/utils": 3.0.21
  autoprefixer: 10.6.1
  nativewind: 4.2.7
  postcss: 8.5.31
  postcss-loader: 8.2.1
  react-native-css-interop: 0.2.7
  tailwind-variants: 0.1.20
  tailwindcss: 3.4.19
