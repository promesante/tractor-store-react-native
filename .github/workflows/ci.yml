name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # On PRs only the packages affected since the base branch are checked.
      - name: Select affected packages
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "args=--filter=...[origin/${{ github.base_ref }}]" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm lint:root
      - run: pnpm turbo run lint typecheck test ${{ steps.filter.outputs.args }}
